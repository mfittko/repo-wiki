name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/cache@v4
        with:
          path: .tsbuildinfo
          key: ${{ runner.os }}-tsbuildinfo-ci-${{ hashFiles('package-lock.json', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-tsbuildinfo-ci-

      - run: npm ci

      - name: Build and test
        run: npm run check

      - name: Pack dry run
        run: npm run pack:check
