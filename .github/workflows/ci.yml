name: Build and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and test
        run: npm run check

      - name: Coverage gate
        run: npm run coverage

      - name: Pack dry run
        run: npm run pack:check
