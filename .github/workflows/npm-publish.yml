name: Publish to npm

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Run checks and tests
        run: npm run check

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
