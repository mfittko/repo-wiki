name: Compile repository wiki

on:
  workflow_dispatch:
    inputs:
      mode:
        description: bootstrap or incremental
        required: true
        default: bootstrap
  push:
    branches:
      - main

jobs:
  compile-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Determine mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "MODE=incremental" >> "$GITHUB_ENV"
          fi

      - name: Scan
        run: node ./dist/bin/repo-wiki.js scan --mode "$MODE" --repo . --out .llmwiki/run

      - name: Plan
        run: node ./dist/bin/repo-wiki.js plan --scan .llmwiki/run --out .llmwiki/plan.json

      - name: Compile
        run: node ./dist/bin/repo-wiki.js compile --scan .llmwiki/run --plan .llmwiki/plan.json --wiki .llmwiki/wiki

      - name: Lint
        run: node ./dist/bin/repo-wiki.js lint --wiki .llmwiki/wiki --scan .llmwiki/run

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-wiki
          path: .llmwiki/wiki

  publish-wiki:
    if: github.ref == 'refs/heads/main'
    needs: compile-wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/download-artifact@v5
        with:
          name: compiled-wiki
          path: .llmwiki/wiki

      - name: Publish wiki
        env:
          LLMWIKI_PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: node ./dist/bin/repo-wiki.js publish --wiki .llmwiki/wiki
