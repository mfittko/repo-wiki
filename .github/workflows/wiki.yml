name: Compile repository wiki

on:
  workflow_dispatch:
    inputs:
      mode:
        description: bootstrap or incremental
        required: true
        default: bootstrap
      publish_pages:
        description: Publish compiled wiki to GitHub Pages branch
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      pages_path:
        description: Path on the gh-pages branch to publish into. Use smoke/pr-N for pre-merge smoke tests.
        required: true
        default: smoke/manual
  push:
    branches:
      - main

jobs:
  compile-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Determine mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> "$GITHUB_ENV"
          else
            echo "MODE=incremental" >> "$GITHUB_ENV"
          fi

      - name: Scan
        run: node ./dist/bin/repo-wiki.js scan --mode "$MODE" --repo . --out .llmwiki/run

      - name: Plan
        run: node ./dist/bin/repo-wiki.js plan --scan .llmwiki/run --out .llmwiki/plan.json

      - name: Compile
        env:
          LLMWIKI_COMPILER_MODE: ${{ vars.LLMWIKI_COMPILER_MODE }}
          LLMWIKI_LLM_PROVIDER: ${{ vars.LLMWIKI_LLM_PROVIDER }}
          LLMWIKI_LLM_BASE_URL: ${{ vars.LLMWIKI_LLM_BASE_URL }}
          LLMWIKI_LLM_MODEL: ${{ vars.LLMWIKI_LLM_MODEL }}
          LLMWIKI_LLM_TEMPERATURE: ${{ vars.LLMWIKI_LLM_TEMPERATURE }}
          LLMWIKI_LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLMWIKI_LLM_MAX_OUTPUT_TOKENS }}
          LLMWIKI_LLM_TIMEOUT_MS: ${{ vars.LLMWIKI_LLM_TIMEOUT_MS }}
          LLMWIKI_LLM_RETRIES: ${{ vars.LLMWIKI_LLM_RETRIES }}
          LLMWIKI_LLM_API_KEY: ${{ secrets.LLMWIKI_LLM_API_KEY }}
          LLMWIKI_LLM_SYSTEM_PROMPT: ${{ vars.LLMWIKI_LLM_SYSTEM_PROMPT }}
          LLMWIKI_LLM_SYSTEM_PROMPT_FILE: ${{ vars.LLMWIKI_LLM_SYSTEM_PROMPT_FILE }}
        run: node ./dist/bin/repo-wiki.js compile --scan .llmwiki/run --plan .llmwiki/plan.json --wiki .llmwiki/wiki

      - name: Lint
        run: node ./dist/bin/repo-wiki.js lint --wiki .llmwiki/wiki --scan .llmwiki/run

      - uses: actions/upload-artifact@v4
        with:
          name: compiled-wiki
          path: .llmwiki/wiki

  publish-wiki:
    if: github.ref == 'refs/heads/main'
    needs: compile-wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/download-artifact@v5
        with:
          name: compiled-wiki
          path: .llmwiki/wiki

      - name: Publish wiki
        env:
          LLMWIKI_PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        run: node ./dist/bin/repo-wiki.js publish --target github-wiki --wiki .llmwiki/wiki

  publish-pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pages == 'true')
    needs: compile-wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/download-artifact@v5
        with:
          name: compiled-wiki
          path: .llmwiki/wiki

      - name: Publish GitHub Pages
        env:
          LLMWIKI_PUBLISH_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          PAGES_PATH: ${{ github.event.inputs.pages_path || '.' }}
        run: node ./dist/bin/repo-wiki.js publish --target github-pages --wiki .llmwiki/wiki --branch gh-pages --pages-path "$PAGES_PATH"
