name: Review Context

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  attach-review-context:
    name: Attach review-context bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install and build
        run: npm ci

      - name: Attach review-context bundle as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/attach-review-context.mjs --pr ${{ github.event.pull_request.number }} --repo . --format md
