name: Task
description: Track a concrete implementation task under an epic.
title: "[Task] "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for implementation tasks, subtasks, and follow-up work that belongs to a roadmap epic.

  - type: input
    id: milestone
    attributes:
      label: Roadmap milestone
      description: Link to the relevant milestone or plan section, if applicable.
      placeholder: "Milestone 2: Production scanner"
    validations:
      required: true

  - type: input
    id: epic
    attributes:
      label: Parent epic
      description: Link the parent epic issue, if applicable.
      placeholder: "#4"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Describe the exact change this task should make.
      placeholder: |
        - [ ] Specific implementation item
        - [ ] Specific follow-up item
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define what must be true for this task to be considered complete.
      placeholder: |
        - [ ] Behavior is implemented and covered by tests.
        - [ ] Verification commands pass.
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Suggested verification
      description: List the commands or checks that should be run.
      placeholder: |
        - npm test
        - npm run check
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant docs, source files, issues, or design notes.
      placeholder: |
        - docs/PLAN.md
        - src/example.ts
    validations:
      required: false
